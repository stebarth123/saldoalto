<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minha área — Saldo Alto para Empresas</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="sa-app.css">
<style>
  :root{
    --pink:#E8156A; --pink-dark:#C4104F; --pink-soft:rgba(232,21,106,0.08); --pink-tint:#FDEBF3;
    --lime:#C6D92E; --lime-dark:#A9BC1F; --lime-soft:rgba(198,217,46,0.28);
    --cream:#FAF3F0; --card:#fff; --ink:#171512; --ink-soft:rgba(23,21,18,0.68); --line:rgba(23,21,18,0.1);
    --display:'Baloo 2',sans-serif; --body:'Quicksand',sans-serif; --radius:22px;
    --shadow:0 14px 30px -22px rgba(23,21,18,0.28);
    /* sequencial de uma cor só (rosa), do claro ao escuro */
    --s1:#F9C9DE; --s2:#F08DB7; --s3:#E8156A; --s4:#C4104F; --s5:#8E0C3B;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--cream); color:var(--ink); font-family:var(--body); font-weight:500; line-height:1.55; -webkit-font-smoothing:antialiased; min-height:100vh;}
  img,svg{display:block; max-width:100%;}
  a{color:inherit;}
  button,input,select,textarea{font-family:inherit; color:inherit;}
  button{cursor:pointer;}
  :focus-visible{outline:3px solid var(--lime-dark); outline-offset:2px;}
  [hidden]{display:none !important;}
  @media (prefers-reduced-motion: reduce){ *{animation-duration:0.001ms !important; transition-duration:0.001ms !important; scroll-behavior:auto !important;} }
  .ic{width:1.15em; height:1.15em; flex-shrink:0;}

  .page{max-width:1180px; margin:0 auto; padding:30px 28px 90px;}
  .page-head{display:flex; align-items:flex-end; justify-content:space-between; gap:16px; flex-wrap:wrap; margin-bottom:22px;}
  .page-head h1{font-family:var(--display); font-weight:800; font-size:clamp(1.7rem,3vw,2.15rem); line-height:1.15;}
  .page-head p{color:var(--ink-soft); font-weight:600; margin-top:4px; max-width:620px;}
  .back{display:inline-flex; align-items:center; gap:6px; font-family:var(--display); font-weight:700; font-size:.95rem; color:var(--ink-soft); text-decoration:none; margin-bottom:12px; padding:4px 0;}
  .back:hover{color:var(--pink);}

  /* botões */
  .btn-primary{background:var(--pink); color:#fff; font-family:var(--display); font-weight:700; font-size:1rem; padding:13px 26px; border:none; border-radius:100px; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px; transition:transform .15s, background .2s, opacity .2s; box-shadow:0 10px 24px -10px rgba(232,21,106,0.55);}
  .btn-primary:hover:not(:disabled){background:var(--pink-dark); transform:translateY(-2px);}
  .btn-primary:disabled{opacity:.55; cursor:wait; box-shadow:none;}
  .btn-primary.big{font-size:1.1rem; padding:16px 32px;}
  .btn-ghost{background:transparent; border:2px solid var(--ink); color:var(--ink); font-family:var(--display); font-weight:700; font-size:.95rem; padding:9px 20px; border-radius:100px; text-decoration:none; display:inline-flex; align-items:center; gap:8px; transition:background .2s, color .2s;}
  .btn-ghost:hover{background:var(--ink); color:var(--cream);}
  .btn-quiet{background:none; border:none; font-family:var(--display); font-weight:700; font-size:.92rem; color:var(--ink-soft); padding:8px 12px; border-radius:100px; display:inline-flex; align-items:center; gap:6px; transition:color .2s, background .2s;}
  .btn-quiet:hover{color:var(--pink); background:var(--pink-soft);}
  .btn-danger{background:var(--pink-dark); color:#fff; border:none; font-family:var(--display); font-weight:700; padding:12px 24px; border-radius:100px;}
  .btn-danger:hover{background:#9c0d3f;}
  .btn-sm{font-size:.86rem; padding:7px 16px;}
  .spin{width:1.05em; height:1.05em; border-radius:50%; border:2.5px solid currentColor; border-right-color:transparent; animation:spin .7s linear infinite; flex-shrink:0;}
  @keyframes spin{to{transform:rotate(360deg);}}

  .card{background:var(--card); border-radius:var(--radius); box-shadow:var(--shadow); border:1px solid rgba(23,21,18,0.06);}
  .pad{padding:26px 28px;}
  .muted{color:var(--ink-soft);}
  .tiny{font-size:.82rem;}
  h2.sec{font-family:var(--display); font-weight:800; font-size:1.25rem; line-height:1.2; margin-bottom:4px;}
  p.sec-sub{color:var(--ink-soft); font-weight:600; font-size:.93rem; margin-bottom:18px;}

  /* aviso de boas-vindas */
  .welcome{display:flex; gap:16px; align-items:center; background:var(--ink); color:var(--cream); border-radius:var(--radius); padding:20px 24px; margin-bottom:20px;}
  .welcome b{font-family:var(--display); font-weight:800; font-size:1.15rem; color:var(--lime); display:block;}
  .welcome p{font-size:.95rem; font-weight:600; color:rgba(252,241,236,.85);}
  .welcome .x{margin-left:auto; background:none; border:none; color:rgba(252,241,236,.7); font-size:1.4rem; line-height:1; padding:6px;}

  /* filtros e lista de pesquisas */
  .toolbar{display:flex; flex-wrap:wrap; gap:12px; align-items:center; justify-content:space-between; margin-bottom:16px;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chip{background:#fff; border:2px solid var(--line); border-radius:100px; padding:7px 16px; font-family:var(--display); font-weight:700; font-size:.9rem; display:inline-flex; align-items:center; gap:8px; transition:border-color .2s, background .2s;}
  .chip:hover{border-color:var(--pink);}
  .chip[aria-pressed="true"]{background:var(--ink); color:var(--cream); border-color:var(--ink);}
  .chip .n{font-size:.78rem; background:rgba(23,21,18,.08); border-radius:100px; padding:0 8px; min-width:22px; text-align:center;}
  .chip[aria-pressed="true"] .n{background:rgba(255,255,255,.2);}
  .search{position:relative; min-width:min(100%,260px);}
  .search input{width:100%; background:#fff; border:2px solid var(--line); border-radius:100px; padding:9px 16px 9px 40px; font-weight:600; font-size:.93rem; outline:none;}
  .search input:focus{border-color:var(--pink);}
  .search svg{position:absolute; left:14px; top:50%; transform:translateY(-50%); width:17px; height:17px; color:var(--ink-soft);}

  .slist{overflow:visible;}
  .shead,.srow{display:grid; grid-template-columns:minmax(0,2.3fr) 110px 128px 110px 150px 44px; gap:14px; align-items:center; padding:0 22px;}
  .shead{font-family:var(--display); font-weight:700; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); padding-top:16px; padding-bottom:10px; border-bottom:1px solid var(--line);}
  .srow{padding-top:16px; padding-bottom:16px; border-bottom:1px solid var(--line); transition:background .15s; position:relative;}
  .srow:last-child{border-bottom:none;}
  .srow:hover{background:rgba(232,21,106,.03);}
  .sname{min-width:0;}
  .sname a{font-family:var(--display); font-weight:800; font-size:1.05rem; line-height:1.25; text-decoration:none; display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .sname a:hover{color:var(--pink);}
  .sname small{display:block; color:var(--ink-soft); font-size:.8rem; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .cell-l{display:none;}
  .badge{display:inline-flex; align-items:center; gap:7px; font-family:var(--display); font-weight:700; font-size:.82rem; border-radius:100px; padding:4px 12px 4px 10px; white-space:nowrap;}
  .badge::before{content:""; width:8px; height:8px; border-radius:50%; background:currentColor;}
  .st-rascunho{background:rgba(23,21,18,.08); color:rgba(23,21,18,.75);}
  .st-revisao{background:var(--pink-tint); color:var(--pink-dark);}
  .st-ativa{background:var(--lime); color:var(--ink);}
  .st-encerrada{background:var(--ink); color:var(--cream);}
  .bar{height:8px; border-radius:100px; background:rgba(23,21,18,.09); overflow:hidden;}
  .bar i{display:block; height:100%; border-radius:100px; background:var(--pink);}
  .bar.lime i{background:var(--lime-dark);}
  .pcell small{display:block; font-size:.78rem; font-weight:700; color:var(--ink-soft); margin-top:4px;}
  .kebab-wrap{position:relative; justify-self:end;}
  .kebab{width:38px; height:38px; border-radius:50%; border:none; background:none; display:flex; align-items:center; justify-content:center; color:var(--ink-soft);}
  .kebab:hover,.kebab[aria-expanded="true"]{background:var(--pink-soft); color:var(--pink);}
  .menu{position:absolute; right:0; top:calc(100% + 4px); min-width:210px; background:#fff; border:1px solid var(--line); border-radius:16px; box-shadow:0 26px 50px -22px rgba(23,21,18,.45); padding:6px; z-index:20;}
  .menu button,.menu a{display:flex; gap:10px; align-items:center; width:100%; background:none; border:none; text-align:left; font-weight:700; font-size:.92rem; padding:9px 12px; border-radius:10px; text-decoration:none;}
  .menu button:hover,.menu a:hover{background:var(--pink-soft); color:var(--pink);}
  .menu .danger{color:var(--pink-dark);}
  .menu svg{width:17px; height:17px;}

  .empty{text-align:center; padding:56px 24px 60px;}
  .empty .art{width:96px; height:96px; border-radius:50%; background:var(--lime); margin:0 auto 20px; display:flex; align-items:center; justify-content:center; color:var(--ink);}
  .empty .art svg{width:44px; height:44px;}
  .empty h2{font-family:var(--display); font-weight:800; font-size:1.5rem; margin-bottom:6px;}
  .empty p{color:var(--ink-soft); font-weight:600; max-width:440px; margin:0 auto 22px;}
  .skeleton{height:74px; margin:0 22px; border-bottom:1px solid var(--line); display:flex; align-items:center;}
  .skeleton i{display:block; height:14px; border-radius:100px; background:linear-gradient(90deg, rgba(23,21,18,.06), rgba(23,21,18,.12), rgba(23,21,18,.06)); background-size:200% 100%; animation:sk 1.2s linear infinite; width:40%;}
  @keyframes sk{to{background-position:-200% 0;}}
  .errbox{text-align:center; padding:44px 24px;}
  .errbox b{font-family:var(--display); font-size:1.2rem; display:block; margin-bottom:6px;}
  .errbox p{color:var(--ink-soft); font-weight:600; margin-bottom:16px;}

  /* detalhe da pesquisa */
  .detail-grid{display:grid; grid-template-columns:1.5fr 1fr; gap:20px; align-items:start;}
  .kv{display:grid; grid-template-columns:150px 1fr; gap:10px 16px; font-size:.95rem;}
  .kv dt{color:var(--ink-soft); font-weight:700;}
  .kv dd{font-weight:700; overflow-wrap:anywhere;}
  .timeline{list-style:none; display:flex; flex-direction:column; gap:0;}
  .timeline li{position:relative; padding:0 0 18px 34px; font-weight:700; color:var(--ink-soft); font-size:.95rem;}
  .timeline li::before{content:""; position:absolute; left:0; top:2px; width:20px; height:20px; border-radius:50%; border:2px solid var(--line); background:#fff;}
  .timeline li::after{content:""; position:absolute; left:9px; top:24px; bottom:0; width:2px; background:var(--line);}
  .timeline li:last-child::after{display:none;}
  .timeline li.done{color:var(--ink);}
  .timeline li.done::before{background:var(--lime); border-color:var(--lime-dark);}
  .timeline li.now::before{background:var(--pink); border-color:var(--pink); box-shadow:0 0 0 5px var(--pink-soft);}
  .timeline li small{display:block; font-weight:600; color:var(--ink-soft); font-size:.82rem;}
  .qlist{list-style:none; counter-reset:q; display:flex; flex-direction:column; gap:10px;}
  .qlist li{counter-increment:q; display:flex; gap:12px; background:var(--cream); border-radius:14px; padding:12px 14px; font-weight:700; font-size:.94rem;}
  .qlist li::before{content:counter(q); flex:none; width:26px; height:26px; border-radius:50%; background:var(--ink); color:var(--lime); font-family:var(--display); font-weight:800; font-size:.82rem; display:flex; align-items:center; justify-content:center;}
  .qlist small{display:block; color:var(--ink-soft); font-weight:600; font-size:.8rem;}
  .note{background:var(--pink-soft); border-radius:14px; padding:12px 16px; font-weight:600; font-size:.9rem;}
  .note.lime{background:var(--lime-soft);}

  /* formulários */
  .fgrid{display:grid; grid-template-columns:1fr 1fr; gap:4px 16px;}
  .field{margin-bottom:14px; min-width:0;}
  .field.full{grid-column:1 / -1;}
  .field label{display:block; font-family:var(--display); font-weight:700; font-size:.86rem; margin-bottom:5px;}
  .field .opt{font-family:var(--body); font-weight:600; color:var(--ink-soft); font-size:.8rem;}
  .field input:not([type=checkbox]):not([type=radio]), .field select, .field textarea{width:100%; font-weight:600; font-size:.96rem; background:#fff; border:2px solid var(--line); border-radius:14px; padding:11px 15px; outline:none; transition:border-color .2s;}
  .field textarea{resize:vertical; min-height:88px;}
  .field input:focus, .field select:focus, .field textarea:focus{border-color:var(--pink);}
  .field input[readonly], .field input:disabled, .field select:disabled{background:var(--cream); color:var(--ink-soft);}
  .field.invalid input, .field.invalid select{border-color:var(--pink-dark); background:rgba(232,21,106,.04);}
  .field .err{display:none; color:var(--pink-dark); font-size:.8rem; font-weight:700; margin-top:4px;}
  .field.invalid .err{display:block;}
  .field .hint{font-size:.8rem; color:var(--ink-soft); font-weight:600; margin-top:4px;}
  .reqs{list-style:none; display:flex; flex-wrap:wrap; gap:4px 14px; margin-top:7px;}
  .reqs li{font-size:.8rem; font-weight:700; color:var(--ink-soft); display:flex; gap:6px; align-items:center;}
  .reqs li::before{content:""; width:13px; height:13px; border-radius:50%; border:2px solid rgba(23,21,18,.25);}
  .reqs li.ok{color:#5b6a08;} .reqs li.ok::before{background:var(--lime); border-color:var(--lime-dark);}
  .form-actions{display:flex; gap:12px; align-items:center; flex-wrap:wrap; margin-top:6px;}
  .form-alert{border-radius:14px; padding:11px 14px; font-size:.9rem; font-weight:700; margin-bottom:14px; background:rgba(196,16,79,.09); color:var(--pink-dark);}

  /* abas de configuração */
  .tabs{display:flex; gap:6px; flex-wrap:wrap; border-bottom:2px solid var(--line); margin-bottom:22px;}
  .tabs a{font-family:var(--display); font-weight:700; font-size:.98rem; text-decoration:none; padding:10px 18px; border-radius:14px 14px 0 0; color:var(--ink-soft); margin-bottom:-2px; border-bottom:3px solid transparent;}
  .tabs a:hover{color:var(--pink);}
  .tabs a.on{color:var(--ink); border-bottom-color:var(--pink);}
  .stack{display:flex; flex-direction:column; gap:20px;}
  .ro-banner{display:flex; gap:10px; align-items:center;}

  /* usuários */
  .utable .urow{display:grid; grid-template-columns:minmax(0,1.6fr) minmax(0,1.5fr) 130px 44px; gap:14px; align-items:center; padding:16px 22px; border-bottom:1px solid var(--line);}
  .utable .urow:last-child{border-bottom:none;}
  .uhead{font-family:var(--display); font-weight:700; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  .uname b{font-family:var(--display); font-weight:800; font-size:1.02rem; display:block; line-height:1.2;}
  .uname small{color:var(--ink-soft); font-weight:600; font-size:.83rem; overflow-wrap:anywhere;}
  .tag{display:inline-block; font-family:var(--display); font-weight:700; font-size:.76rem; border-radius:100px; padding:2px 10px; margin:2px 4px 2px 0; background:rgba(23,21,18,.07);}
  .tag.owner{background:var(--ink); color:var(--lime);}
  .tag.fin{background:var(--lime); color:var(--ink);}
  .tag.pink{background:var(--pink-tint); color:var(--pink-dark);}
  .roles{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .role{display:flex; gap:10px; align-items:flex-start; border:2px solid var(--line); border-radius:16px; padding:12px 14px; cursor:pointer; background:#fff;}
  .role:has(input:checked){border-color:var(--pink); background:var(--pink-tint);}
  .role input{margin-top:4px; accent-color:var(--pink);}
  .role b{font-family:var(--display); font-weight:800; display:block; line-height:1.2;}
  .role span{font-size:.82rem; font-weight:600; color:var(--ink-soft); display:block; margin-top:2px;}
  .perm-list{display:flex; flex-direction:column; gap:8px; margin:4px 0 12px; padding:12px 14px; border-radius:14px; background:var(--cream);}
  .perm-list label{display:flex; gap:10px; align-items:center; font-weight:700; font-size:.92rem; cursor:pointer;}
  .perm-list input{width:18px; height:18px; accent-color:var(--pink);}
  .secret{font-family:ui-monospace,Menlo,monospace; font-weight:700; font-size:1.15rem; background:var(--cream); border-radius:12px; padding:12px 16px; display:flex; justify-content:space-between; gap:10px; align-items:center; overflow-wrap:anywhere;}

  /* modal */
  .overlay{position:fixed; inset:0; background:rgba(23,21,18,.55); backdrop-filter:blur(2px); display:flex; align-items:center; justify-content:center; padding:18px; z-index:200;}
  .modal{background:var(--cream); border-radius:28px; width:100%; max-width:560px; max-height:90vh; overflow:auto; padding:30px 30px 26px; box-shadow:0 40px 80px -30px rgba(23,21,18,.55); position:relative;}
  .modal h3{font-family:var(--display); font-weight:800; font-size:1.4rem; line-height:1.2; margin-bottom:6px; padding-right:34px;}
  .modal .sub{color:var(--ink-soft); font-weight:600; font-size:.94rem; margin-bottom:18px;}
  .modal .x{position:absolute; right:16px; top:16px; width:36px; height:36px; border-radius:50%; border:none; background:rgba(23,21,18,.06); font-size:1.1rem;}
  .modal .x:hover{background:rgba(23,21,18,.12);}
  .modal-actions{display:flex; gap:10px; justify-content:flex-end; flex-wrap:wrap; margin-top:10px;}

  /* Inteligência da Base */
  .fbar{display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; margin-bottom:18px;}
  .fbar .field{margin:0; min-width:180px;}
  .seg{display:inline-flex; background:#fff; border:2px solid var(--line); border-radius:100px; padding:3px; margin-left:auto;}
  .seg button{border:none; background:none; font-family:var(--display); font-weight:700; font-size:.88rem; padding:6px 16px; border-radius:100px;}
  .seg button[aria-pressed="true"]{background:var(--ink); color:var(--cream);}
  .kpis{display:grid; grid-template-columns:repeat(4,1fr); gap:14px; margin-bottom:18px;}
  .kpi{padding:18px 20px;}
  .kpi .l{font-family:var(--display); font-weight:700; font-size:.8rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft);}
  .kpi .v{font-family:var(--display); font-weight:800; font-size:2.1rem; line-height:1.1; margin-top:4px;}
  .kpi .s{font-size:.82rem; font-weight:600; color:var(--ink-soft);}
  .charts{display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start;}
  .chart{padding:22px 24px 24px;}
  .chart.wide{grid-column:1 / -1;}
  .chart h3{font-family:var(--display); font-weight:800; font-size:1.08rem; line-height:1.2;}
  .chart .cs{color:var(--ink-soft); font-weight:600; font-size:.84rem; margin:2px 0 16px;}
  .demo-tag{display:inline-block; font-family:var(--display); font-weight:700; font-size:.72rem; background:var(--lime); border-radius:100px; padding:2px 10px; margin-left:8px; vertical-align:middle; text-transform:uppercase; letter-spacing:.03em;}
  .hb{display:flex; flex-direction:column; gap:10px;}
  .hb-row{display:grid; grid-template-columns:minmax(90px,40%) 1fr 50px; gap:12px; align-items:center; font-size:.9rem; font-weight:700;}
  .hb-row .lb{line-height:1.25;}
  .hb-track{height:22px; display:flex; align-items:center;}
  .hb-fill{height:14px; border-radius:2px 4px 4px 2px; background:var(--pink); min-width:3px; transition:opacity .15s;}
  .hb-row:hover .hb-fill{opacity:.8;}
  .hb-row .vl{text-align:right; font-family:var(--display); font-weight:800;}
  .cols{display:flex; align-items:flex-end; gap:6px; height:190px; padding-top:10px;}
  .col{flex:1; min-width:0; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; gap:6px;}
  .col .cb{width:100%; max-width:24px; background:var(--pink); border-radius:4px 4px 0 0; min-height:2px;}
  .col .cl{font-size:.7rem; font-weight:700; color:var(--ink-soft); white-space:nowrap;}
  .col:hover .cb{opacity:.8;}
  .stackbar{display:flex; gap:2px; height:24px;}
  .stackbar i{display:block; height:100%; border-radius:4px;}
  .legend{display:flex; flex-wrap:wrap; gap:6px 18px; margin-top:12px; font-size:.86rem; font-weight:700;}
  .legend span{display:inline-flex; gap:7px; align-items:center;}
  .legend b{display:inline-block; width:12px; height:12px; border-radius:3px;}
  .tilemap{display:grid; grid-template-columns:repeat(8,1fr); gap:5px; max-width:460px; margin:0 auto;}
  .tile{aspect-ratio:1; border-radius:10px; display:flex; flex-direction:column; align-items:center; justify-content:center; font-family:var(--display); font-weight:800; font-size:.85rem; line-height:1.1;}
  .tile small{font-size:.68rem; font-weight:700; opacity:.85;}
  .tile.off{background:transparent; border:1.5px dashed rgba(23,21,18,.14); color:rgba(23,21,18,.3);}
  .tile.void{visibility:hidden;}
