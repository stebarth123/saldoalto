  const f = (key, label, ph, type = 'text', full = false, val = c[key], extra = '') => `<div class="ff ${e[key] ? 'invalid' : ''} ${full ? 'full' : ''}"><label for="c-${key}">${label}</label><input class="field" id="c-${key}" type="${type}" data-input="contact-${key}" data-fk="c-${key}" value="${esc(val)}" placeholder="${ph}" autocomplete="${auto[key] || 'off'}" ${extra}><span class="err">${e[key] || ''}</span></div>`;
  const consentBox = (txt) => `<label class="consent ${UI.contactErr && !c.consent ? 'invalid' : ''}" style="${UI.contactErr && !c.consent ? 'outline:2px solid var(--pink-dark);outline-offset:2px' : ''}"><input type="checkbox" data-change="contact-consent" ${c.consent ? 'checked' : ''}><span>${txt}</span></label>`;
  const price = `<div class="price" style="margin-top:22px"><div class="k">Investimento estimado</div><div class="amt">${fmtBRL(priceNow().total)}</div><span class="from">A partir de ${fmtBRL(CONFIG.MIN_PRICE)}</span>
      <button type="button" class="btn-quiet" data-action="pricing-how">${icon('info')}Como calculamos?</button></div>`;
  if (visitor) {
    const sel = `<div class="ff full ${e.setor ? 'invalid' : ''}"><label for="c-setor">Setor de atuação *</label><select class="field" id="c-setor" data-change="contact-setor" data-fk="c-setor"><option value="">Selecione</option>${SETORES.map(o => `<option ${c.setor === o ? 'selected' : ''}>${esc(o)}</option>`).join('')}</select><span class="err">${e.setor || ''}</span></div>`;
    const pw = (key, label, ph) => `<div class="ff ${e[key] ? 'invalid' : ''}"><label for="c-${key}">${label}</label><input class="field" id="c-${key}" type="password" data-input="reg-${key}" data-fk="c-${key}" value="${esc(UI.reg[key])}" placeholder="${ph}" autocomplete="new-password"><span class="err">${e[key] || ''}</span></div>`;
    return `${StepHeader({ screen: 'contratacao', title: 'Crie sua conta e <span class="accent">envie a pesquisa</span>', sub: 'Os dados da sua empresa viram o seu cadastro no Saldo Alto. Depois você acompanha tudo em Minhas pesquisas.' })}
  <div class="step-body">
    <div class="form-grid">
      <div class="reg-sec">Dados da empresa</div>
      ${f('company', 'Nome da empresa *', 'Como a empresa é conhecida')}${f('cnpj', 'CNPJ *', '00.000.000/0000-00', 'text', false, SA.maskCnpj(c.cnpj), 'inputmode="numeric" maxlength="18"')}
      ${sel}
      <div class="reg-sec">Seus dados e acesso</div>
      ${f('name', 'Seu nome *', 'Nome e sobrenome')}${f('email', 'E-mail de acesso *', 'voce@empresa.com.br', 'email')}
      ${f('whatsapp', 'WhatsApp *', '(11) 90000-0000', 'tel', true, c.whatsapp, 'inputmode="tel" maxlength="15"')}
      ${pw('senha', 'Senha *', 'Crie uma senha')}${pw('senha2', 'Confirmar senha *', 'Repita a senha')}
      <ul class="reg-reqs full" id="regReqs" aria-live="polite" style="grid-column:1 / -1">${regReqsHTML()}</ul>
    </div>
    ${consentBox('Li e aceito a <a href="politica-privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a> e a <a href="politica-cancelamento.html" target="_blank" rel="noopener">Política de Cancelamento</a>, e concordo com o contato comercial sobre esta pesquisa. *')}
    <p class="reg-note">Já tem conta? <a href="entrar.html?next=criar-pesquisa.html">Entrar e continuar esta pesquisa</a> · seu rascunho fica guardado neste navegador.</p>
    ${price}
  </div>`;
  }
  return `${StepHeader({ screen: 'contratacao', title: 'Últimos detalhes para <span class="accent">contratar</span>', sub: 'Deixe seus dados de contato. Nosso time confirma o escopo e o valor final antes do pagamento.' })}
  <div class="step-body">
    <div class="form-grid">${f('name', 'Seu nome *', 'Nome e sobrenome')}${f('company', 'Empresa *', 'Nome da empresa')}${f('email', 'E-mail *', 'voce@empresa.com.br', 'email')}${f('whatsapp', 'WhatsApp *', '(11) 90000-0000', 'tel')}</div>
    ${consentBox('Li e concordo com o uso dos meus dados para contato comercial, conforme a <a href="politica-privacidade.html" target="_blank" rel="noopener">Política de Privacidade</a>. *')}
    ${SA.can('financeiro') ? '' : '<div class="perm-note">Só quem tem acesso financeiro (o titular da conta ou o titular financeiro) pode contratar. Salve o rascunho e peça para essa pessoa concluir a contratação.</div>'}
    ${price}
  </div>`;
}
function CheckoutDone() {
  const c = S.contracted;
  return `<div class="done-hero"><div class="done-badge">${icon('check')}</div>
    <span class="eyebrow">Pesquisa enviada</span>
    <h1 class="step-title" style="margin:0 auto">Recebemos a sua <span class="accent">pesquisa!</span></h1>
    ${UI.justRegistered ? `<p class="step-sub" style="margin:12px auto 0">Sua conta também foi criada, com o e-mail <b>${esc(UI.justRegistered)}</b>. Use a senha que você acabou de definir para entrar da próxima vez.</p>` : ''}${SA.isDemo() ? '<p class="step-sub" style="margin:12px auto 0"><b>Demonstração:</b> nada foi enviado ao time de verdade.</p>' : ''}<p class="step-sub" style="margin:12px auto 0">Código <b>${esc(c.id)}</b>. Ela já aparece em <b>Minhas pesquisas</b> com o status “Em revisão”. Nosso time vai revisar tudo e falar com você pelo WhatsApp em até 1 dia útil para confirmar o escopo e o valor final.</p>
    <div class="done-actions"><a class="btn-primary" href="painel.html#pesquisas">Ver em Minhas pesquisas</a>
      ${SA.isDemo() ? '' : `<a class="btn-ghost" target="_blank" rel="noopener" href="${whatsappLink()}">${icon('chat')}Falar com o time agora</a>`}
      <button type="button" class="btn-quiet" data-action="new-campaign">Criar outra pesquisa</button></div></div>`;
}
function whatsappLink() {
  const c = S.contracted || {}, qc = questionCounts();
  const msg = `Olá! Acabei de montar uma pesquisa no Saldo Alto (código ${c.id || ''}).\nObjetivo: ${S.objective.trim().slice(0, 240)}\n${S.material.involves ? `Material a validar: ${S.material.desc.trim() || 'arquivo anexado'}\n` : ''}Amostra: ${fmtInt(sampleSize())} respostas · ${plural(qc.total, 'pergunta', 'perguntas')}\nInvestimento estimado: ${fmtBRL(c.total || priceNow().total)} (a partir de ${fmtBRL(CONFIG.MIN_PRICE)}).`;
  return `https://wa.me/${CONFIG.WHATSAPP}?text=${encodeURIComponent(msg)}`;
}
function contactErrors() {
  const c = S.contact, e = {};
  if (c.name.trim().length < 2) e.name = 'Informe seu nome.';
  if (c.company.trim().length < 2) e.company = 'Informe o nome da empresa.';
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(c.email.trim())) e.email = 'Informe um e-mail válido.';
  if (c.whatsapp.replace(/\D/g, '').length < 10) e.whatsapp = 'Informe um WhatsApp com DDD.';
  if (isVisitor()) {
    if (!SA.validCnpj(c.cnpj)) e.cnpj = 'CNPJ inválido. Confira os 14 números.';
    if (!c.setor) e.setor = 'Escolha o setor de atuação.';
    if (SA.passwordChecks(UI.reg.senha).some(r => !r.ok)) e.senha = 'A senha precisa de 8 caracteres, uma letra e um número.';
    if (!UI.reg.senha2 || UI.reg.senha2 !== UI.reg.senha) e.senha2 = 'As senhas não conferem.';
  }
  Object.keys(UI.srv).forEach(k => { if (UI.srv[k] && !e[k]) e[k] = UI.srv[k]; });   // erros vindos do servidor (CNPJ já cadastrado, e-mail em uso…)
  return e;
}
</script>
<script>
/* ---------- 6. CampaignWizard: controlador, validações e ações ---------- */
const SCREENS = {
  objetivo: { render: ObjectiveStep }, publico: { render: AudienceStep },
  amostra: { render: SampleSizeStep }, perguntas: { render: QuestionBuilder },
  revisao: { render: CampaignReview }, contratacao: { render: CheckoutStep }
};
const OK = { ok: true, hint: '' };
const VALID = {
  objetivo: () => S.objective.trim().length < 15 ? { ok: false, hint: 'Conte um pouco mais sobre o que você quer descobrir.' }
    : S.audience.desc.trim().length < 10 ? { ok: false, hint: 'Descreva o público que você quer pesquisar.' }
    : S.audience.universe != null && !(S.audience.universe >= CONFIG.MIN_SAMPLE) ? { ok: false, hint: `O universo informado precisa ter ao menos ${CONFIG.MIN_SAMPLE} pessoas. Corrija ou deixe em branco.` }
    : S.material.involves === null ? { ok: false, hint: 'Diga se sua pesquisa envolve validar algum material.' }
    : S.material.involves && !S.material.desc.trim() && !S.media.length ? { ok: false, hint: 'Descreva ou anexe o material que será avaliado.' } : OK,
  publico: () => !nicheLabels().length ? { ok: false, hint: 'Escolha ao menos um nicho.' }
    : ageError() || incomeError() ? { ok: false, hint: ageError() || incomeError() }
    : OK,
  amostra: () => {
    const m = S.sample.mode, n = sampleSize();
    if (!m) return { ok: false, hint: 'Escolha como definir a amostra.' };
    if (n < CONFIG.MIN_SAMPLE || n > CONFIG.MAX_SAMPLE) return { ok: false, hint: `Informe entre ${fmtInt(CONFIG.MIN_SAMPLE)} e ${fmtInt(CONFIG.MAX_SAMPLE)} respostas.` };
    return OK;
  },
  perguntas: () => UI.editingId ? { ok: false, hint: 'Conclua a edição da pergunta para continuar.' }
    : !S.questions.length ? { ok: false, hint: 'Adicione ao menos uma pergunta.' } : OK,
  revisao: () => OK, contratacao: () => isVisitor() || SA.can('financeiro') ? OK : { ok: false, hint: 'Só quem tem acesso financeiro pode contratar. Salve o rascunho.' }
};
const frontierIndex = () => { const i = ALL_SCREENS.findIndex(s => !S.completed.includes(s)); return i < 0 ? ALL_SCREENS.length - 1 : i; };
const firstInvalid = () => ['objetivo', 'publico', 'amostra', 'perguntas'].find(s => !VALID[s]().ok);

const lastCounts = {};
function animateCounters() {
  $$('.count[data-to]').forEach(el => {
    const to = +el.dataset.to, key = el.dataset.key, from = lastCounts[key] ?? to;
    lastCounts[key] = to;
    if (from === to) { el.textContent = fmtInt(to); return; }
    const t0 = performance.now(), dur = 450;
    const tick = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = fmtInt(from + (to - from) * (1 - Math.pow(1 - p, 3))); if (p < 1 && el.isConnected) requestAnimationFrame(tick); };
    requestAnimationFrame(tick);
  });
}

function renderFooter() {
  const el = $('#footbar');
  if (S.contracted) { el.innerHTML = ''; return; }
  const v = VALID[S.screen](), busy = UI.submitting;
  const backToReview = UI.returnToReview && !['revisao', 'contratacao'].includes(S.screen);
  const label = backToReview ? 'Voltar à revisão' : S.screen === 'revisao' ? (isVisitor() ? 'Informar dados da empresa' : 'Contratar pesquisa') : S.screen === 'contratacao' ? (isVisitor() ? 'Criar conta e enviar pesquisa' : 'Confirmar contratação') : 'Continuar';
  el.innerHTML = `${!v.ok ? `<div class="foot-hint-m">${esc(v.hint)}</div>` : ''}<div class="row">
    <div class="foot-actions">${S.screen === 'objetivo' ? '' : `<button type="button" class="btn-ghost" data-action="go-back" data-fk="back">${icon('arrowLeft')}Voltar</button>`}</div>
    <span class="foot-hint">${!v.ok ? esc(v.hint) : ''}</span>
    <div class="foot-actions"><button type="button" class="btn-primary" id="nextBtn" data-action="go-next" data-fk="next" ${!v.ok || busy ? 'disabled' : ''}>${busy ? '<span class="spin"></span>Enviando…' : `${label}${icon('arrowRight')}`}</button></div></div>`;
}
function renderChrome() { const st = $('#saveExitTop'); if (st) st.hidden = !!S.contracted || isVisitor(); $('#mprogress').innerHTML = ProgressBar(); renderFooter(); }

function render({ enter = false } = {}) {
  const a = document.activeElement, fk = a && a.getAttribute ? a.getAttribute('data-fk') : null, y = window.scrollY;
  const stage = $('#stage');
  const dd = $('.dd-list'), ddTop = dd ? dd.scrollTop : 0;
  stage.innerHTML = SCREENS[S.screen].render();
  const dd2 = $('.dd-list'); if (dd2) dd2.scrollTop = ddTop;
  renderChrome();
  if (enter) { stage.classList.remove('enter'); void stage.offsetWidth; stage.classList.add('enter'); window.scrollTo({ top: 0, behavior: 'instant' }); stage.focus({ preventScroll: true }); }
  else window.scrollTo({ top: y, behavior: 'instant' });
  const key = UI.focusKey || (!enter ? fk : null); UI.focusKey = null;
  if (key) { const el = document.querySelector(`[data-fk="${CSS.escape(key)}"]`); if (el && !el.disabled) { el.focus({ preventScroll: !UI.scrollToFocus }); } }
  UI.scrollToFocus = false;
  animateCounters();
}

let toastTimer;
function toast(msg, ic = 'check') { const t = $('#toast'); t.innerHTML = icon(ic) + '<span>' + esc(msg) + '</span>'; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 3400); }
const Modal = {
  open(html) { UI.opener = document.activeElement; $('#modalCard').innerHTML = `<button type="button" class="modal-x" data-action="modal-close" aria-label="Fechar">${icon('x')}</button>${html}`; $('#modal').classList.add('open'); setTimeout(() => { const f = $('#modalCard .btn-primary, #modalCard .exp, #modalCard .opt, #modalCard .btn-ghost'); if (f) f.focus(); }, 30); },
  close() { $('#modal').classList.remove('open'); if (UI.opener && UI.opener.focus && document.contains(UI.opener)) UI.opener.focus({ preventScroll: true }); }
};

/* Navegação */
function goTo(screen) {
  if (!SCREENS[screen] || ALL_SCREENS.indexOf(screen) > frontierIndex()) return;
  S.screen = screen; UI.menuId = null; UI.editingId = null; UI.editErr = ''; UI.dd = null; UI.infoOpen = false;
  if (screen === 'revisao') UI.returnToReview = false;
  persist(); render({ enter: true });
}
function next() {
  const v = VALID[S.screen]();
  if (!v.ok) { toast(v.hint, 'alert'); return; }
  if (S.screen === 'contratacao') return submit();
  if (S.screen === 'revisao') { const bad = firstInvalid(); if (bad) { toast(`Ajuste “${stepOf(bad).label}” antes de contratar.`, 'alert'); return; } }
  mutate(s => { if (!s.completed.includes(s.screen)) s.completed.push(s.screen); }, { render: false });
  if (UI.returnToReview && S.screen !== 'revisao') return goTo('revisao');
  goTo(ALL_SCREENS[ALL_SCREENS.indexOf(S.screen) + 1]);
}
function back() { const i = ALL_SCREENS.indexOf(S.screen); if (i > 0) { UI.returnToReview = false; goTo(ALL_SCREENS[i - 1]); } }

const SERVER_FIELD = { empresa: 'company', cnpj: 'cnpj', nome: 'name', email: 'email', telefone: 'whatsapp', senha: 'senha', aceite: 'consent' };
async function submit() {
  const errs = contactErrors();
  if (Object.keys(errs).length || !S.contact.consent) { UI.contactErr = true; render(); toast('Confira os campos destacados.', 'alert'); return; }
  UI.submitting = true; renderFooter();
  try {
    // 1) sem conta ainda: os dados da empresa viram o cadastro na plataforma
    if (isVisitor()) {
      const c = S.contact;
      try {
        const data = await SA.api('register', { empresa: c.company.trim(), cnpj: SA.digits(c.cnpj), setor: c.setor, nome: c.name.trim(), email: c.email.trim(),
          telefone: SA.digits(c.whatsapp), senha: UI.reg.senha, aceite: true });
        SA.saveSession(data, false);
        UI.justRegistered = c.email.trim().toLowerCase(); UI.reg = { senha: '', senha2: '' }; UI.srv = {};
        Draft.clearAnon();
      } catch (err) {
        if (err.fields) { UI.srv = {}; Object.keys(err.fields).forEach(k => { UI.srv[SERVER_FIELD[k] || k] = err.fields[k]; }); UI.contactErr = true; }
        UI.submitting = false; render(); toast(err.message || 'Não foi possível criar a conta agora.', 'alert'); return;
      }
    }
    // 2) envia a pesquisa para a conta (nova ou já existente)
    clearTimeout(Sync.timer); await Sync.idle();
    const c = S.contact, pricing = priceNow();
    const res = await SA.api('surveys.submit', { id: S.surveyId || undefined, nome: surveyName(), resumo: { ...surveySummary(), preco: pricing.total },
      contato: { name: c.name.trim(), company: c.company.trim(), email: c.email.trim(), whatsapp: c.whatsapp.replace(/\D/g, '') }, dados: { ...S, pricing } });
    const p = res.pesquisa;
    mutate(s => { s.contracted = { id: p.codigo, at: p.enviadaEm, total: pricing.total, surveyId: p.id }; s.surveyId = p.id;
      ['revisao', 'contratacao'].forEach(x => { if (!s.completed.includes(x)) s.completed.push(x); });
      s.contact = { name: '', company: '', cnpj: '', setor: '', email: '', whatsapp: '', consent: false }; }, { render: false });
    Draft.clear(p.id); Draft.clear(null); Draft.clearAnon(); Sync.status('idle');
    history.replaceState(null, '', 'criar-pesquisa.html?id=' + encodeURIComponent(p.id));
    userChrome();
  } catch (e) { toast(e.message || 'Não foi possível enviar agora. Tente novamente.', 'alert'); userChrome(); }
  UI.submitting = false; UI.contactErr = false; render({ enter: true });
}

/* IA (mock) */
async function runAISuggestions() {
  if (UI.sugLoading) return;
  UI.sugLoading = true; render();
  try {
    const list = await Services.AI.suggestFromObjective({ objective: S.objective, material: S.material, niches: nicheLabels(), profile: S.profile });
    S.suggestions = [...S.suggestions.filter(s => s.source === 'media'), ...list]; S.aiAutoRan = true; persist();
    toast(`${list.length} perguntas sugeridas pela IA.`, 'sparkles');
  } catch (e) { toast('Não foi possível gerar as sugestões agora.', 'alert'); }
  UI.sugLoading = false; render();
}
async function runMediaAI(id) {
  const m = S.media.find(x => x.id === id); if (!m || UI.mediaLoading[id]) return;
  UI.mediaLoading[id] = true; render();
  try {
    const list = await Services.AI.suggestFromMedia({ media: m });
    S.suggestions = [...S.suggestions.filter(s => s.mediaId !== id), ...list]; m.aiDone = true; persist();
    toast(`${list.length} perguntas sugeridas sobre o material.`, 'sparkles');
  } catch (e) { toast('Não foi possível analisar o material agora.', 'alert'); }
  UI.mediaLoading[id] = false; render();
}

/* Perguntas */
function makeQuestion(type, extra = {}) {
  const q = { text: '', type, options: [], scale: { max: 5, low: 'Nada', high: 'Muito' }, range: { min: 0, max: 500, unit: 'R$' }, source: 'manual', ...extra, id: uid() };
  ensureTypeDefaults(q); return q;
}
function ensureTypeDefaults(q) { if (['single', 'multiple', 'ranking'].includes(q.type) && (q.options || []).filter(o => o.trim()).length < 2) q.options = ['Opção 1', 'Opção 2', 'Opção 3']; }
const qById = id => S.questions.find(q => q.id === id);
function finishEdit(id) {
  const q = qById(id); if (!q) return;
  const clean = q.options.map(o => o.trim()).filter(Boolean);
  let err = '';
  if (!q.text.trim()) err = 'Escreva a pergunta.';
  else if (['single', 'multiple', 'ranking'].includes(q.type) && clean.length < 2) err = 'Adicione pelo menos 2 opções.';
  else if (q.type === 'range' && !(q.range.min < q.range.max)) err = 'O valor máximo precisa ser maior que o mínimo.';
  if (err) { UI.editErr = err; const el = $('#edErr'); if (el) el.textContent = err; return; }
  q.text = q.text.trim(); if (['single', 'multiple', 'ranking'].includes(q.type)) q.options = clean;
  UI.editErr = ''; UI.editingId = null; persist(); UI.focusKey = `qe-${id}`; render();
}
const moveToQuestions = (qid, edit = false) => {
  const i = S.suggestions.findIndex(s => s.id === qid); if (i < 0) return;
  const [q] = S.suggestions.splice(i, 1); S.questions.push(q);
  if (edit) { UI.editingId = q.id; UI.focusKey = `qt-${q.id}`; UI.scrollToFocus = true; }
};

/* Público: sugestões para ampliar */
function clearedProfile(p, g) {
  const c = { ...p, edu: [...p.edu], momento: [...p.momento], local: { ...p.local }, others: [...p.others] };
  if (g === 'age') { c.ageMin = null; c.ageMax = null; } else if (g === 'income') { c.incMin = null; c.incMax = null; } else if (g === 'edu') c.edu = []; else if (g === 'momento') c.momento = [];
  else if (g === 'regiao') c.local = { regiao: '', uf: '', cidade: '' }; else c.others = [];
  return c;
}

/* Materiais */
const EXT_MIME = { jpg: 'image/jpeg', jpeg: 'image/jpeg', png: 'image/png', webp: 'image/webp', gif: 'image/gif', mp4: 'video/mp4', mov: 'video/quicktime', webm: 'video/webm' };
const IMG_TYPES = ['image/jpeg', 'image/png', 'image/webp', 'image/gif'], VID_TYPES = ['video/mp4', 'video/quicktime', 'video/webm'];
const mimeOf = f => f.type || EXT_MIME[(f.name.split('.').pop() || '').toLowerCase()] || '';
async function handleFiles(list) {
  let added = 0; const rejected = [];
  for (const f of [...list]) {
    const mt = mimeOf(f), isImg = IMG_TYPES.includes(mt), isVid = VID_TYPES.includes(mt);
    if (!isImg && !isVid) { rejected.push(`${f.name}: formato não suportado`); continue; }
    const lim = isImg ? CONFIG.MAX_IMAGE_MB : CONFIG.MAX_VIDEO_MB;
    if (f.size > lim * 1048576) { rejected.push(`${f.name}: passa de ${lim} MB`); continue; }
    const id = uid(); await MediaStore.put(id, f);
    S.media.push({ id, kind: isImg ? 'image' : 'video', name: f.name, size: f.size, type: mt, aiDone: false }); added++;
  }
  persist(); render();
  if (rejected.length) toast(rejected[0] + (rejected.length > 1 ? ` (+${rejected.length - 1})` : ''), 'alert');
  else if (added) toast(added === 1 ? 'Arquivo adicionado.' : `${added} arquivos adicionados.`);
}

function migrateDraft(d) {
  const base = initialState();
  const out = { ...base, ...d, v: 2, sample: { ...base.sample, ...d.sample }, contact: { ...base.contact, ...d.contact },
    material: { ...base.material, ...(d.material || {}) }, profile: { ...base.profile, ...(d.profile || {}) }, audience: { ...base.audience, ...(d.audience || {}) } };
  const dp = d.profile || {}, P = out.profile;
  ['momento', 'edu'].forEach(k => { if (!Array.isArray(P[k])) P[k] = []; });
  if (!Array.isArray(P.others)) P.others = (dp.otherOn && String(dp.other || '').trim()) ? [String(dp.other).trim()] : [];      // "Outros critérios" era um texto único
  if (!P.local || typeof P.local !== 'object') P.local = { regiao: Array.isArray(dp.regiao) && dp.regiao[0] ? dp.regiao[0] : '', uf: '', cidade: '' };
  P.local = { regiao: P.local.regiao || '', uf: P.local.uf || '', cidade: P.local.cidade || '' };
  if (P.local.uf && (!ufBy(P.local.uf) || ufBy(P.local.uf).r !== P.local.regiao)) P.local = { regiao: P.local.regiao, uf: '', cidade: '' };   // nunca combinações incoerentes
  if (!P.local.uf) P.local.cidade = '';
  delete P.regiao; delete P.otherOn; delete P.other;
  if (out.audience.universe != null && !(Number(out.audience.universe) > 0)) out.audience.universe = null;
  if (d.v === 1) {
    const f = d.filters || {}, pick = (map, ids) => (ids || []).map(id => map[id]).filter(Boolean);
    const ages = pick({ '18-24': [18, 24], '25-34': [25, 34], '35-44': [35, 44], '45-54': [45, 54], '55+': [55, null] }, f.age);
    if (ages.length) { out.profile.ageMin = Math.min(...ages.map(a => a[0])); out.profile.ageMax = ages.some(a => a[1] == null) ? null : Math.max(...ages.map(a => a[1])); }
    const inc = pick({ r1: [0, 1500], r2: [1501, 3000], r3: [3001, 5000], r4: [5001, 10000], r5: [10001, null] }, f.income);
    if (inc.length) { const lo = Math.min(...inc.map(a => a[0])); out.profile.incMin = lo || null; out.profile.incMax = inc.some(a => a[1] == null) ? null : Math.max(...inc.map(a => a[1])); }
    const eduMap = { fund: ['fund_i', 'fund_c'], medio: ['medio_i', 'medio_c'], tec: ['medio_c'], sup: ['sup_i', 'sup_c'], pos: ['pos'] };
    out.profile.edu = [...new Set((f.edu || []).flatMap(id => eduMap[id] || []))];
    out.niches = (d.niches || []).filter(id => id !== 'outro');
    out.material = { involves: (d.media || []).length ? true : null, desc: '' };
    const scr = { nichos: 'publico', perfil: 'publico', materiais: 'perguntas' };
    out.screen = scr[d.screen] || d.screen;
    out.completed = [...new Set((d.completed || []).map(x => x === 'materiais' ? null : (scr[x] || x)).filter(Boolean))];
    if (!(d.completed || []).includes('nichos')) out.completed = out.completed.filter(x => x !== 'publico');
    delete out.filters;
  }
  return out;
}

function fatal(msg, href = 'painel.html#pesquisas', label = 'Voltar para Minhas pesquisas') {
  $('#stage').innerHTML = `<div class="done-hero"><h1 class="step-title" style="margin:0 auto">Não foi possível abrir a pesquisa</h1><p class="step-sub" style="margin:12px auto 0">${esc(msg)}</p><div class="done-actions"><a class="btn-primary" href="${href}">${esc(label)}</a></div></div>`;
  $('#footbar').innerHTML = ''; $('#mprogress').innerHTML = '';
}

/* Cabeçalho: visitante vê "Entrar"; quem tem conta vê o menu do usuário */
function userChrome() {
  const v = isVisitor(), slot = $('#userSlot');
  $('#topLogo').href = v ? 'saldo-alto-empresas.html' : 'painel.html#pesquisas';
  $('#topLogo').setAttribute('aria-label', v ? 'Saldo Alto — voltar para o site' : 'Saldo Alto — voltar para Minhas pesquisas');
  const back = $('#topBack'); back.href = v ? 'saldo-alto-empresas.html' : 'painel.html#pesquisas'; back.textContent = v ? '← Voltar ao site' : '← Minhas pesquisas';
  if (v) slot.innerHTML = '<a class="btn-quiet" href="entrar.html?next=criar-pesquisa.html">Já tenho conta · Entrar</a>';
  else { slot.innerHTML = SA.userMenuHTML(); SA.bindUserMenu(slot); }
  const st = $('#saveExitTop'); if (st) st.hidden = v || !!S.contracted;
}

(async function boot() {
  if (CONFIG.DEMO_MODE) $('#demoPill').hidden = false;
  const qid = new URLSearchParams(location.search).get('id');
  let me = null, resumed = false, recovered = false, adopted = false;

  if (SA.session()) {
    try { me = await SA.guard(); } catch (e) { fatal(e.message); return; }
    if (!SA.can('pesquisas_criar')) { location.replace('painel.html#pesquisas'); return; }
    if (qid) {
      try {
        const d = await SA.api('surveys.get', { id: qid }), p = d.pesquisa;
        if (p.status !== 'rascunho') { location.replace('painel.html#pesquisa/' + encodeURIComponent(qid)); return; }
        let st = p.dados; const local = Draft.load(qid);
        if (local && local.state && (!st || local.at > p.atualizadaEm)) { st = local.state; recovered = true; }
        S = migrateDraft(st || {}); S.surveyId = qid; if (!S.name && p.nome && p.nome !== 'Pesquisa sem nome') S.name = p.nome;
        if (!SCREENS[S.screen]) S.screen = 'objetivo';
        resumed = S.completed.length > 0 || S.objective.trim().length > 0;
      } catch (e) { fatal(e.code === 'nao_encontrado' ? 'Esta pesquisa não existe ou não pertence à sua empresa.' : e.message); return; }
    } else {
      // veio do "Entrar" depois de começar a pesquisa sem conta: traz o rascunho junto
      const anon = Draft.loadAnon();
      if (anon && anon.state && !anon.state.contracted) {
        S = migrateDraft(anon.state); S.surveyId = null; if (!SCREENS[S.screen]) S.screen = 'objetivo';
        Draft.clearAnon(); adopted = true; resumed = true;
      }
    }
    // dados de contato já vêm da conta
    const u = me.user, a = me.account, c = S.contact;
    if (!c.name) c.name = u.nome || ''; if (!c.company) c.company = a.empresa || ''; if (!c.email) c.email = u.email || ''; if (!c.whatsapp) c.whatsapp = SA.maskPhone(u.telefone || '');
  } else {
    // visitante: monta a pesquisa aqui e cria a conta na última etapa
    const local = Draft.load(null);
    if (local && local.state && !local.state.contracted) { S = migrateDraft(local.state); if (!SCREENS[S.screen]) S.screen = 'objetivo'; resumed = S.completed.length > 0 || S.objective.trim().length > 0; }
    if (S.screen === 'contratacao' && !S.completed.includes('revisao')) S.screen = 'objetivo';
  }
  userChrome();
  for (const m of S.media) await MediaStore.restore(m.id);
  render({ enter: true });
  if (adopted) { toast('Trouxemos a pesquisa que você começou. Ela já está na sua conta.'); Sync.schedule(400); }
  else if (recovered) { toast('Recuperamos alterações que não tinham sido enviadas.'); Sync.schedule(400); }
  else if (resumed && !S.contracted) toast('Continuamos de onde você parou.');
  if (isVisitor()) { if (Sync.hasContent()) Sync.status('local'); }
  else if (S.surveyId && !recovered) Sync.status('saved');
})();
</script>
